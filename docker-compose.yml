version: '3.8'

services:
  # 1. Frontend UI (Next.js)
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyDCgcN9KHLtJljAqGT0iyCwhRiBGLEarDE
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - medflow-network

  # 2. Backend API (FastAPI)
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - WATCHFILES_FORCE_POLLING=true
      # Database connection strings
      - MYSQL_URL=mysql+pymysql://medflow:medflow123@mysql:3306/medflow
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=medflow_neo4j
      # External APIs passed via environment variables
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SAFEPAY_PUBLIC_KEY=${SAFEPAY_PUBLIC_KEY}
      - SAFEPAY_SECRET_KEY=${SAFEPAY_SECRET_KEY}
    depends_on:
      - mysql
      - neo4j
    volumes:
      - ./backend:/app
    networks:
      - medflow-network

  # 3. Relational Database (MySQL)
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: medflow
      MYSQL_USER: medflow
      MYSQL_PASSWORD: medflow123
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - medflow-network

  # 4. Graph Database (Neo4j)
  neo4j:
    image: neo4j:5.11
    ports:
      - "7474:7474" # HTTP Dashboard
      - "7687:7687" # Bolt connection for application
    environment:
      NEO4J_AUTH: neo4j/medflow_neo4j
    volumes:
      - neo4j_data:/data
    networks:
      - medflow-network

  # 5. Workflow Automation (n8n)
  n8n:
    image: n8nio/n8n
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - medflow-network

volumes:
  # Persistent storage for our databases so data isn't lost on restart
  mysql_data:
  neo4j_data:
  n8n_data:

networks:
  # Custom network so containers can communicate using service names (e.g., "mysql")
  medflow-network:
    driver: bridge
